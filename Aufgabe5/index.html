<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVT Master Portfolio - Adam Ziegler</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --border: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 850px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        header {
            text-align: center;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; color: #f1f5f9; }
        p.subtitle { color: #94a3b8; font-size: 0.85rem; margin: 0; }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: #94a3b8;
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn:hover { background-color: #1e293b; color: #fff; }
        .tab-btn.active { background-color: var(--accent); color: #030712; border-color: var(--accent); }

        /* Task Container */
        .task-card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .task-card.active { display: flex; }
        .task-title { font-size: 1.1rem; color: #e2e8f0; margin: 0; text-align: center; }

        canvas {
            width: 400px;
            height: 400px;
            background-color: #000;
            border-radius: 12px;
            border: 2px solid #334155;
        }

        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; align-items: center; }
        .btn { background: #334155; color: white; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn:hover { background: #475569; }
        .btn.primary { background-color: var(--accent); color: #030712; font-weight: bold; }

        .info-box {
            font-size: 0.82rem; color: #94a3b8; background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2); padding: 1rem; border-radius: 8px; width: 100%; box-sizing: border-box; line-height: 1.4;
        }
        .info-box h4 { margin: 0 0 0.3rem 0; color: var(--accent); }
        .info-box ul { margin: 0; padding-left: 1.2rem; }

        /* Aufgabe 1 CSS Disk Styling */
        .disk-container {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #3b82f6 30%, #1e293b 70%);
            border-radius: 50%;
            border: 4px solid #38bdf8;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            transition: transform 0.3s ease;
        }
        .disk-marker {
            width: 12px; height: 100px;
            background-color: #ef4444;
            position: absolute;
            top: 15px;
            border-radius: 6px;
            transform-origin: bottom center;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>Graphical Visualisation Technologies</h1>
            <p class="subtitle">BHT Master-Portfolio • Adam Ziegler</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(0)">1. Animierte Scheibe</button>
            <button class="tab-btn" onclick="switchTab(1)">2 & 3. WebGL Geometrien</button>
            <button class="tab-btn" onclick="switchTab(2)">4. Param. Flächen</button>
            <button class="tab-btn" onclick="switchTab(3)">5. Kamera & Rekursive Kugel</button>
        </nav>

        <!-- AUFGABE 1 -->
        <div id="task-0" class="task-card active">
            <h2 class="task-title">Aufgabe 1: Interaktiv animierte Scheibe</h2>
            <div style="padding: 20px;">
                <div id="css-disk" class="disk-container">
                    <div class="disk-marker"></div>
                </div>
            </div>
            <div style="color: var(--accent); font-weight: bold;"
