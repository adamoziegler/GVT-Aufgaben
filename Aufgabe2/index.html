<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVT Aufgabe 2 - Komplexe WebGL Geometrie (Seestern)</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #1e293b;
        }
        h1 { font-size: 1.4rem; margin-top: 0; color: #f1f5f9; }
        p { color: #94a3b8; font-size: 0.85rem; }
        canvas {
            width: 450px;
            height: 450px;
            background-color: #000000;
            border-radius: 12px;
            border: 2px solid #334155;
            margin: 1rem 0;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.15);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Komplexe WebGL 2D-Geometrie: Bio-Geometrischer Seestern</h1>
        <p>Prozedural generiertes Liniennetzwerk mit Vertex-Farbverläufen und hoher Vertex-Dichte.</p>
        
        <canvas id="glcanvas" width="450" height="450"></canvas>

        <div class="stats">
            <div>Render-Modus: <code>gl.LINES / LINE_STRIP</code></div>
            <div>Aktive Vertices: <span id="vertex-count">0</span></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('glcanvas');
            const gl = canvas.getContext('webgl');

            if (!gl) {
                alert('WebGL wird nicht unterstützt!');
                return;
            }

            // --- PROZEDURALE GEOMETRIE-GENERIERUNG (> 150 Vertices mit Farben) ---
            const positionData = [];
            const colorData = [];

            function addVertex(x, y, r, g, b) {
                positionData.push(x, y);
                colorData.push(r, g, b);
            }

            const arms = 5;
            const outerR = 0.8;
            const innerR = 0.35;
            const coreR = 0.15;

            // 1. Äußeres filigranes Stern-Netzwerk (Multi-Layered Wireframe)
            const points = [];
            for (let i = 0; i < arms * 2; i++) {
                const angle = (i * Math.PI) / arms - Math.PI / 2;
                const radius = (i % 2 === 0) ? outerR : innerR;
                points.push({
                    x: Math.cos(angle) * radius,
                    y: Math.sin(angle) * radius
                });
            }

            // Äußeren Umriss zeichnen mit Farbverlauf von Cyan zu Tiefblau
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];
                
                // Segment mit Farbinterpolation
                addVertex(p1.x, p1.y, 0.1, 0.8, 1.0); // Cyan
                addVertex(p2.x, p2.y, 0.4, 0.2, 0.9); // Violett/Blau
            }

            // 2. Innere geometrische Struktur (Verbindungspunkte zum Kern & diagonale Streben)
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const coreAngle = (i * Math.PI) / arms - Math.PI / 2;
                const cx = Math.cos(coreAngle) * coreR;
                const cy = Math.sin(coreAngle) * coreR;

                // Linie von Kern zu Außenpunkt
                addVertex(cx, cy, 0.2, 0.5, 1.0);
                addVertex(p.x, p.y, 0.1, 0.9, 0.8);

                // Querverbindungen zwischen benachbarten Spitzen für komplexe Facetten
                const nextP = points[(i + 2) % points.length];
                addVertex(p.x, p.y, 0.8, 0.1, 0.8);
                addVertex(nextP.x, nextP.y, 0.2, 0.8, 0.9);
            }

            // 3. Konzentrisches Innen-Hexagon / Mandala-Kern
            const coreSegments = 16;
            for (let i = 0; i < coreSegments; i++) {
                const a1 = (i / coreSegments) * Math.PI * 2;
                const a2 = ((i + 1) / coreSegments) * Math.PI * 2;
                
                const r1 = coreR * 0.8;
                const r2 = coreR * 1.2;

                addVertex(Math.cos(a1) * r1, Math.sin(a1) * r1, 1.0, 0.4, 0.7);
                addVertex(Math.cos(a2) * r2, Math.sin(a2) * r2, 0.3, 0.8, 1.0);
            }

            const totalVertices = positionData.length / 2;
            document.getElementById('vertex-count').textContent = totalVertices;

            // --- SHADER MIT FARB-ATTRIBUTEN ---
            const vsSource = `
                attribute vec2 aPosition;
                attribute vec3 aColor;
                varying vec3 vColor;
                void main() {
                    gl_Position = vec4(aPosition, 0.0, 1.0);
                    vColor = aColor;
                }
            `;

            const fsSource = `
                precision mediump float;
                varying vec3 vColor;
                void main() {
                    gl_FragColor = vec4(vColor, 1.0);
                }
            `;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error(gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program);
            gl.useProgram(program);

            // --- POSITION BUFFER ---
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positionData), gl.STATIC_DRAW);
            const posAttr = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(posAttr);
            gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

            // --- COLOR BUFFER ---
            const colBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colorData), gl.STATIC_DRAW);
            const colAttr = gl.getAttribLocation(program, 'aColor');
            gl.enableVertexAttribArray(colAttr);
            gl.vertexAttribPointer(colAttr, 3, gl.FLOAT, false, 0, 0);

            // --- RENDERN ---
            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            // Zeichnen als Linien-Primitive mit hoher Vertex-Anzahl
            gl.drawArrays(gl.LINES, 0, totalVertices);
        });
    </script>
</body>
</html>
