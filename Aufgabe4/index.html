<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVT Aufgabe 4 - Parametrisierte Flächen</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
        }
        h1 { font-size: 1.3rem; margin-top: 0; color: #f1f5f9; text-align: center; }
        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin: 1rem 0;
        }
        canvas {
            width: 400px;
            height: 400px;
            background-color: #000000;
            border-radius: 12px;
            border: 2px solid #334155;
        }
        .controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover { background-color: #475569; }
        button.active { background-color: var(--accent); color: #030712; font-weight: bold; }
        .info-panel {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
        .info-panel h3 { margin: 0 0 0.5Rem 0; color: var(--accent); font-size: 0.95rem; }
        ul { margin: 0; padding-left: 1.2rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Parametrisierte Flächen in WebGL</h1>
        
        <div class="controls">
            <button id="btn-surface-0" class="active" onclick="switchSurface(0)">1. Helicos / Torus-Spirale</button>
            <button id="btn-surface-1" onclick="switchSurface(1)">2. Muschel (Seashell)</button>
            <button id="btn-surface-2" onclick="switchSurface(2)">3. [Eigenkreation] Ozean-Welle</button>
            <button id="btn-mode" onclick="toggleMode()">Modus: Linien + Füllung</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="glcanvas" width="400" height="400"></canvas>
        </div>

        <div id="surface-info" class="info-panel">
            <h3>Fläche 1: Torus-Spirale (Helicos)</h3>
            <p><strong>Quelle:</strong> <a href="http://www.3d-meier.de/" target="_blank" style="color:var(--accent)">3D-Meier.de</a></p>
            <p><strong>Mathematische Beschreibung:</strong> Basiert auf trigonometrischen Kreis- und Spiralgleichungen im 3D-Raum.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            alert('WebGL wird nicht unterstützt!');
        }

        let currentSurfaceIndex = 0;
        let renderMode = 0; // 0: Linien+Füllung, 1: Nur Linien, 2: Nur Füllung

        // --- SHADER SETUP ---
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aColor;
            varying vec3 vColor;
            void main() {
                gl_Position = vec4(aPosition, 1.0);
                vColor = aColor;
            }
        `;
        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const posAttr = gl.getAttribLocation(program, 'aPosition');
        const colAttr = gl.getAttribLocation(program, 'aColor');

        const posBuffer = gl.createBuffer();
        const colBuffer = gl.createBuffer();
        const indexBuffer = gl.createBuffer();

        // --- GENERIERUNGS-FUNKTIONEN FÜR PARAMETRISIERTE FLÄCHEN ---
        function generateParametricMesh(func, uMin, uMax, uSteps, vMin, vMax, vSteps, scale) {
            const positions = [];
            const colors = [];
            const indices = [];

            for (let i = 0; i <= uSteps; i++) {
                const u = uMin + (i / uSteps) * (uMax - uMin);
                for (let j = 0; j <= vSteps; j++) {
                    const v = vMin + (j / vSteps) * (vMax - vMin);
                    
                    const p = func(u, v);
                    // Skalierung ins NDC-Fenster (-1 bis +1)
                    positions.push(p.x * scale, p.y * scale, p.z * scale);

                    // Kolorierung basierend auf Position / Parametern (Farbverlauf)
                    colors.push(
                        Math.min(1.0, Math.max(0.0, (p.x * scale + 1) * 0.5)),
                        Math.min(1.0, Math.max(0.0, (p.y * scale + 1) * 0.5)),
                        Math.min(1.0, Math.max(0.0, (p.z * scale + 1) * 0.5 + 0.3))
                    );
                }
            }

            // Indizes für Dreiecksnetz (Mesh)
            for (let i = 0; i < uSteps; i++) {
                for (let j = 0; j < vSteps; j++) {
                    const row1 = i * (vSteps + 1);
                    const row2 = (i + 1) * (vSteps + 1);

                    const idx1 = row1 + j;
                    const idx2 = row1 + j + 1;
                    const idx3 = row2 + j;
                    const idx4 = row2 + j + 1;

                    // Zwei Dreiecke pro Quad
                    indices.push(idx1, idx2, idx3);
                    indices.push(idx2, idx4, idx3);
                }
            }

            return { positions, colors, indices };
        }

        // Definition der 3 Flächen
        const surfaces = [
            // 1. Torus-Spirale (Helicos) nach 3d-meier.de
            {
                name: "1. Torus-Spirale (Helicos)",
                source: "3d-meier.de (Parametrisierte Flächen)",
                desc: "Kombination aus Kreis- und Spiralgleichungen.",
                func: (u, v) => {
                    const r = 0.5 + 0.2 * Math.cos(v);
                    return {
                        x: r * Math.cos(u),
                        y: r * Math.sin(u),
                        z: 0.2 * v + 0.1 * Math.sin(v)
                    };
                },
                uMin: 0, uMax: Math.PI * 4, uSteps: 25,
                vMin: 0, vMax: Math.PI * 2, vSteps: 15,
                scale: 0.6
            },
            // 2. Seashell (Muschel)
            {
                name: "2. Muschel (Seashell)",
                source: "Stemkoski / 3D-Meier Formelsammlung",
                desc: "Logarithmische Spirale im 3D-Raum.",
                func: (u, v) => {
                    const a = 0.4;
                    const x = a * (1 - u / (2 * Math.PI)) * Math.cos(2 * u) * (1 + Math.cos(v));
                    const y = a * (1 - u / (2 * Math.PI)) * Math.sin(2 * u) * (1 + Math.cos(v));
                    const z = a * (u / (2 * Math.PI)) + a * (1 - u / (2 * Math.PI)) * Math.sin(v);
                    return { x: x - 0.2, y: y, z: z - 0.4 };
                },
                uMin: 0, uMax: Math.PI * 2, uSteps: 25,
                vMin: 0, vMax: Math.PI * 2, vSteps: 15,
                scale: 0.5
            },
            // 3. Eigene Kreation: "Bio-Ozean-Welle" (Modifizierte Wellenform)
            {
                name: "3. [Eigenkreation] Ozean-Welle",
                source: "Eigene Formel-Kombination (Adam Ziegler)",
                desc: "x = u, y = sin(u*3) * cos(v*2) * 0.4, z = v. Mischeffekt aus trigonometrischen Dämpfungskurven.",
                func: (u, v) => {
                    return {
                        x: u,
                        y: Math.sin(u * 3.0) * Math.cos(v * 2.0) * 0.4,
                        z: v
                    };
                },
                uMin: -1.2, uMax: 1.2, uSteps: 25,
                vMin: -1.2, vMax: 1.2, vSteps: 25,
                scale: 0.7
            }
        ];

        function renderSurface(index) {
            const s = surfaces[index];
            const mesh = generateParametricMesh(s.func, s.uMin, s.uMax, s.uSteps, s.vMin, s.vMax, s.vSteps, s.scale);

            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mesh.positions), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(posAttr);
            gl.vertexAttribPointer(posAttr, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, colBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(mesh.colors), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(colAttr);
            gl.vertexAttribPointer(colAttr, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(mesh.indices), gl.STATIC_DRAW);

            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // Zeichnen je nach Modus
            if (renderMode === 0 || renderMode === 2) {
                // Gefüllte Dreiecke
                gl.drawElements(gl.TRIANGLES, mesh.indices.length, gl.UNSIGNED_SHORT, 0);
            }
            if (renderMode === 0 || renderMode === 1) {
                // Liniennetz darüber (oder separat) in dunklerer/kontrastreicher Optik
                // Für saubere Linien zeichnen wir die Dreieckskanten
                gl.drawElements(gl.LINES, mesh.indices.length, gl.UNSIGNED_SHORT, 0);
            }

            // UI Info aktualisieren
            document.getElementById('surface-info').innerHTML = `
                <h3>${s.name}</h3>
                <p><strong>Quelle:</strong> ${s.source}</p>
                <p><strong>Beschreibung:</strong> ${s.desc}</p>
            `;
        }

        function switchSurface(index) {
            currentSurfaceIndex = index;
            for(let i=0; i<3; i++) {
                document.getElementById(`btn-surface-${i}`).classList.remove('active');
            }
            document.getElementById(`btn-surface-${index}`).classList.add('active');
            renderSurface(currentSurfaceIndex);
        }

        function toggleMode() {
            renderMode = (renderMode + 1) % 3;
            const modes = ["Modus: Linien + Füllung", "Modus: Nur Linien", "Modus: Nur Füllung"];
            document.getElementById('btn-mode').textContent = modes[renderMode];
            renderSurface(currentSurfaceIndex);
        }

        // Tastensteuerung per "B" (wie in der Aufgabe gefordert)
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'b') {
                currentSurfaceIndex = (currentSurfaceIndex + 1) % surfaces.length;
                switchSurface(currentSurfaceIndex);
            }
        });

        // Initialer Render-Aufruf
        renderSurface(0);
    </script>
</body>
</html>
